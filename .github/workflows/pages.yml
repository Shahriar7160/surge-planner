# Publish the S.U.R.G.E. web planner (rework/web) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy web planner
on:
  push:
    branches: [main, surge]
    paths: ["rework/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the engine against the Python pipeline
        run: node rework/web/test/engine.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rework/web
      - id: deployment
        uses: actions/deploy-pages@v4
